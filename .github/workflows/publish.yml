name: Publish Package

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
          scope: '@tech-kn'

      # npm Trusted Publishing requires npm 11.5.1 or newer.
      - run: npm install --global npm@11.5.1
      - run: pnpm install --frozen-lockfile
      - name: Set package version from tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          test "$version" != "$TAG"
          pnpm --filter @tech-kn/constraint exec npm version "$version" --no-git-tag-version
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @tech-kn/constraint build
      - name: Publish to npm
        working-directory: packages/constraint
        run: npm publish --access public
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
