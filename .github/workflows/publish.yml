name: Publish Package

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@tech-kn'

      - run: pnpm install --frozen-lockfile
      - name: Set package version from tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          test "$version" != "$TAG"
          pnpm --filter @tech-kn/constraint exec npm version "$version" --no-git-tag-version
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @tech-kn/constraint build
      - run: pnpm --filter @tech-kn/constraint publish --no-git-checks
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
